services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-tramite-img
    container_name: api-tramite
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - IS_CONTAINER=true
      - FILES_CONTAINER_PATH=/app/files
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - "${UPLOADS_FILES_PATH}:/app/files/uploads"
      - "${LOGS_FILES_PATH}:/app/files/logs"
